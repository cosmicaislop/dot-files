format = "$directory$git_branch$git_status${custom.git_worktree}$cmd_duration$claude_model$claude_context$claude_cost$line_break$character$time"
command_timeout = 1000

# Catppuccin Mocha palette
# base: #1e1e2e  surface0: #313244  overlay1: #7f849c
# blue: #89b4fa  mauve: #cba6f7    sky: #89dceb
# green: #a6e3a1 yellow: #f9e2af   peach: #fab387
# red: #f38ba8   text: #cdd6f4

[directory]
style = "bold #89b4fa"

[git_branch]
style = "bold #cba6f7"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold #f9e2af"
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "~"
untracked = "?"
staged = "+"

[custom.git_worktree]
description = "Display current git worktree name"
# This command gets the basename of the git root directory
command = "basename $(git rev-parse --show-toplevel 2>/dev/null)"
# Only show this if we are actually inside a git worktree
when = '[ "$(git rev-parse --git-dir 2>/dev/null)" != "$(git rev-parse --git-common-dir 2>/dev/null)" ]'
format = "via [🌴 $output](bold green) "
style = "bold purple"


[golang]
symbol = "󰟓 "
style = "bold #89dceb"

[nodejs]
style = "bold #a6e3a1"

[python]
style = "bold #f9e2af"

[cmd_duration]
style = "#7f849c"

[character]
success_symbol = "[❯](bold #a6e3a1)"
error_symbol = "[❯](bold #f38ba8)"

[time]
disabled = false
format = "[$time]($style) "
time_format = "%H:%M"
style = "#7f849c"

[claude_model]
symbol = " "
style = "bold #89b4fa"
# model_aliases = { "claude-sonnet-4-6" = "sonnet" }  # shorten model names

[claude_context]
gauge_width = 10

[[claude_context.display]]
threshold = 0
hidden = true

[[claude_context.display]]
threshold = 30
style = "bold #a6e3a1"

[[claude_context.display]]
threshold = 60
style = "bold #f9e2af"

[[claude_context.display]]
threshold = 80
style = "bold #f38ba8"

[claude_cost]
[[claude_cost.display]]
threshold = 0.0
hidden = true

[[claude_cost.display]]
threshold = 1.0
style = "bold #fab387"

[[claude_cost.display]]
threshold = 5.0
style = "bold #f38ba8"
