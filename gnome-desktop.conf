[app-folders]
folder-children=['System', 'Utilities', 'YaST', 'Pardus']

[app-folders/folders/Pardus]
categories=['X-Pardus-Apps']
name='X-Pardus-Apps.directory'
translate=true

[app-folders/folders/System]
apps=['org.gnome.baobab.desktop', 'org.gnome.DiskUtility.desktop', 'org.gnome.Logs.desktop', 'org.freedesktop.MalcontentControl.desktop', 'org.freedesktop.GnomeAbrt.desktop', 'org.gnome.SystemMonitor.desktop']
name='X-GNOME-Shell-System.directory'
translate=true

[app-folders/folders/Utilities]
apps=['org.gnome.Decibels.desktop', 'org.gnome.Connections.desktop', 'org.gnome.Papers.desktop', 'org.gnome.font-viewer.desktop', 'org.gnome.Loupe.desktop']
name='X-GNOME-Shell-Utilities.directory'
translate=true

[app-folders/folders/YaST]
categories=['X-SuSE-YaST']
name='suse-yast.directory'
translate=true

[background]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/f43/default/f43.xml'
picture-uri-dark='file:///usr/share/backgrounds/f43/default/f43.xml'
primary-color='#000000000000'
secondary-color='#000000000000'

[break-reminders/eyesight]
play-sound=true

[break-reminders/movement]
duration-seconds=uint32 300
interval-seconds=uint32 1800
play-sound=true

[input-sources]
current=uint32 0
show-all-sources=true
sources=[('xkb', 'us')]
xkb-options=['compose:ralt', 'lv3:switch', 'caps:ctrl_shifted_capslock']

[interface]
color-scheme='prefer-dark'
document-font-name='JetBrains Mono 12'
font-name='JetBrains Mono 11'
gtk-key-theme='Default'
gtk-theme='Adwaita'
icon-theme='Papirus-Dark'
show-battery-percentage=false
toolkit-accessibility=false

[notifications]
application-children=['org-gnome-software', 'gnome-power-panel', 'gnome-about-panel', 'org-gnome-showtime', 'fr-handbrake-ghb', 'org-gnome-nautilus', 'vlc', 'org-gnome-decibels', 'com-discordapp-discord', 'com-brave-browser', 'org-freedesktop-problems-applet', 'libreoffice-calc', 'proton-mail', 'com-mitchellh-ghostty', 'us-zoom-zoom', 'org-gnome-tweaks', 'org-gnome-settings', 'com-orcaslicer-orcaslicer', 'org-gnome-boxes']

[notifications/application/com-brave-browser]
application-id='com.brave.Browser.desktop'

[notifications/application/com-discordapp-discord]
application-id='com.discordapp.Discord.desktop'

[notifications/application/com-mitchellh-ghostty]
application-id='com.mitchellh.ghostty.desktop'

[notifications/application/com-orcaslicer-orcaslicer]
application-id='com.orcaslicer.OrcaSlicer.desktop'

[notifications/application/fr-handbrake-ghb]
application-id='fr.handbrake.ghb.desktop'

[notifications/application/gnome-about-panel]
application-id='gnome-about-panel.desktop'

[notifications/application/gnome-power-panel]
application-id='gnome-power-panel.desktop'

[notifications/application/libreoffice-calc]
application-id='libreoffice-calc.desktop'

[notifications/application/org-freedesktop-problems-applet]
application-id='org.freedesktop.problems.applet.desktop'

[notifications/application/org-gnome-boxes]
application-id='org.gnome.Boxes.desktop'

[notifications/application/org-gnome-decibels]
application-id='org.gnome.Decibels.desktop'

[notifications/application/org-gnome-nautilus]
application-id='org.gnome.Nautilus.desktop'

[notifications/application/org-gnome-settings]
application-id='org.gnome.Settings.desktop'

[notifications/application/org-gnome-showtime]
application-id='org.gnome.Showtime.desktop'

[notifications/application/org-gnome-software]
application-id='org.gnome.Software.desktop'

[notifications/application/org-gnome-tweaks]
application-id='org.gnome.tweaks.desktop'

[notifications/application/proton-mail]
application-id='proton-mail.desktop'

[notifications/application/us-zoom-zoom]
application-id='us.zoom.Zoom.desktop'

[notifications/application/vlc]
application-id='vlc.desktop'

[peripherals/touchpad]
two-finger-scrolling-enabled=true

[privacy]
report-technical-problems=false

[screensaver]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/f43/default/f43.xml'
primary-color='#000000000000'
secondary-color='#000000000000'

[search-providers]
sort-order=['org.gnome.Settings.desktop', 'org.gnome.Contacts.desktop', 'org.gnome.Nautilus.desktop']

[wm/keybindings]
switch-input-source=@as []
switch-input-source-backward=@as []
